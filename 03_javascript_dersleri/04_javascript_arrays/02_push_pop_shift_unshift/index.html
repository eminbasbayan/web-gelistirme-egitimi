<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>JavaScript’te push, pop, shift ve unshift Metotları</title>
  </head>
  <body>
    <h1>JavaScript’te push, pop, shift ve unshift Metotları</h1>

    <script>
      // push, pop, shift, unshift

      const sira = ["Ayşe", "Mehmet", "Zeynep"];
      console.log(sira);
      sira.push("Enes");
      console.log(sira);
      const silinen = sira.pop();
      console.log(silinen);
      
      console.log(sira);
      const islenen = sira.shift();
      console.log(islenen);
      console.log(sira);
      sira.unshift("Selin")
      console.log(sira);

    </script>
  </body>
</html>
