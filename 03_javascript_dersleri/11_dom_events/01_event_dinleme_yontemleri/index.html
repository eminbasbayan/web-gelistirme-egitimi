<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>JavaScript DOM Events: Event Dinleme Yöntemleri</title>
  </head>
  <body>
    <h1>JavaScript DOM Events: Event Dinleme Yöntemleri</h1>

    <!-- <button onclick="hello()">Click</button> -->
    <button id="benimButon">Click</button>

    <script>
      const buton = document.querySelector('#benimButon');

      function hello() {
        console.log('Hello World!');
        alert('Hello World!');

        buton.removeEventListener('click', hello);
      }

      /*  buton.onclick = hello; */

      /* buton.addEventListener('click', function () {
        alert('Hello World!');
      }); */

      /* buton.addEventListener('click', hello, { once: true }); */
      buton.addEventListener('click', hello);
    </script>
  </body>
</html>
