      function tekrarEt(text) {
        try {
          return (text.toUpperCase() + ' ').repeat(3);
        } catch (error) {
          return "Lütfen sadece metin giriniz!"
        }
      }

      console.log(tekrarEt('Emin'));
      console.log(tekrarEt(123));
      console.log(tekrarEt(456));
    </script>
