<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>JavaScript'te Fonksiyonlara Argüman Geçmek</title>
  </head>
  <body>
    <h1>JavaScript'te Fonksiyonlara Argüman Geçmek</h1>

    <script>
      function sayHello(name) {
        console.log('Merhaba ', name);
      }

      sayHello('Emin');
      sayHello('Nur');
      sayHello('Emir');

      sayHello('Ahmet');
      sayHello();

      function multiply(number) {
        console.log(number * 2);
      }

      multiply(10);
      multiply(15);
      multiply()
    </script>
  </body>
</html>
