<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>JavaScript’te Spread Operatörü</title>
  </head>
  <body>
    <h1>JavaScript’te Spread (...) Operatörü</h1>

    <script>
    //   console.log(Math.max(10, 25, 156, 85));

    //   console.log(Math.min(10, 7, 156, 85));

      const notlar = [15, 7, 56, 75, 64];
 
                           // 15, 7, 56, 75, 64
      console.log(Math.max(...notlar));
      console.log(Math.min(...notlar));

      console.log("BilGen Yazılım Akademi");
      console.log(..."BilGen Yazılım Akademi");
      
      
    </script>
  </body>
</html>
