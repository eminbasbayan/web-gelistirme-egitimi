<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>JavaScript'te Sonsuz Döngüler (Infinite Loops)</title>
  </head>
  <body>
    <h1>JavaScript'te Sonsuz Döngüler (Infinite Loops)</h1>

    <script>
      for (let j = 50; j <= 100; j++){
        console.log(j);
      }
    </script>
  </body>
