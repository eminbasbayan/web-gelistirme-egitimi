<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>JavaScript While Döngüsü</title>
  </head>
  <body>
    <h1>JavaScript While Döngüsü</h1>

    <script>
      let sayi = 1;

      while (sayi <= 30) {
        console.log('Şu anki sayı:', sayi);

        sayi++;
      }
    </script>
  </body>
</html>
